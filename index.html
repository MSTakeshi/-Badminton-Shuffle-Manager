<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Shuffle Manager</title>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <header class="app-header">
            <h1>Badminton Shuffle Manager</h1>
        </header>

        <main id="main-content">
            <!-- Views will be injected here -->
            <div id="home-view" class="view-container">
                <div class="club-grid" id="club-list">
                    <!-- Club Cards will be rendered here -->

                    <!-- Add Club Button Card -->
                    <div class="club-card add-club-card" id="btn-add-club">
                        <div class="icon">+</div>
                        <div class="text">新しいクラブを作成</div>
                    </div>
                </div>
            </div>

            <!-- Club Detail View -->
            <div id="club-detail-view" class="view-container hidden">
                <div class="detail-header">
                    <button id="btn-back-home" class="btn btn-text">← クラブ一覧へ</button>
                    <h2 id="detail-club-name">Club Name</h2>
                    <button id="btn-club-settings" class="btn btn-icon">⚙️</button>
                </div>

                <div class="tab-menu">
                    <button class="tab-btn active" data-tab="players">プレイヤー</button>
                    <button class="tab-btn" data-tab="session">今日のセッション</button>
                    <button class="tab-btn" data-tab="history">戦歴</button>
                    <button class="tab-btn" data-tab="settings">設定</button>
                </div>

                <div class="tab-content">
                    <!-- Players Tab -->
                    <div id="tab-players" class="tab-pane active">
                        <div class="players-toolbar">
                            <div class="search-box">
                                <input type="text" id="player-search" placeholder="名前で検索...">
                            </div>
                            <button id="btn-add-player-modal" class="btn btn-primary">+ メンバー追加</button>
                        </div>

                        <div class="players-list-header">
                            <div class="col-check">参加</div>
                            <div class="col-name">名前</div>
                            <div class="col-level">レベル</div>
                            <div class="col-actions">操作</div>
                        </div>
                        <div id="players-list" class="players-list">
                            <!-- Player Rows -->
                        </div>
                    </div>

                    <!-- Session Tab -->
                    <div id="tab-session" class="tab-pane">
                        <div class="session-controls">
                            <div class="control-group">
                                <label>日付</label>
                                <input type="date" id="session-date">
                            </div>
                            <div class="control-group">
                                <label>コート数</label>
                                <input type="number" id="session-courts" min="1" max="10" value="2">
                            </div>
                            <div class="control-group">
                                <label>モード</label>
                                <select id="session-mode">
                                    <option value="doubles">ダブルス</option>
                                    <option value="singles">シングルス</option>
                                </select>
                            </div>
                            <button id="btn-shuffle" class="btn btn-primary">組み合わせをシャッフル</button>
                        </div>

                        <!-- Timer Section -->
                        <div class="timer-container">
                            <div class="timer-display">
                                <span id="timer-minutes">15</span>:<span id="timer-seconds">00</span>
                            </div>
                            <div class="timer-controls">
                                <button id="btn-timer-toggle" class="btn btn-secondary">スタート</button>
                                <button id="btn-timer-reset" class="btn btn-text">リセット</button>
                                <button id="btn-timer-test" class="btn btn-icon" title="音声テスト">🔊</button>
                                <div class="timer-settings">
                                    <label>時間設定:</label>
                                    <input type="number" id="timer-duration" value="15" min="1" max="60"
                                        style="width: 60px;">分
                                </div>
                            </div>
                        </div>

                        <div class="session-stats-bar">
                            <span id="participating-count">参加: 0名</span>
                            <span id="waiting-count">待機: 0名</span>
                        </div>

                        <div id="courts-container" class="courts-grid">
                            <!-- Courts will be rendered here -->
                        </div>

                        <div id="waiting-list-container" class="waiting-list-container hidden">
                            <h3>Waiting Members</h3>
                            <div id="waiting-list" class="waiting-list"></div>
                        </div>
                    </div>
                    <div id="tab-history" class="tab-pane">戦歴画面（準備中）</div>
                    <div id="tab-settings" class="tab-pane">設定画面（準備中）</div>
                </div>
            </div>
        </main>

        <!-- Modals -->
        <div id="modal-add-club" class="modal hidden">
            <div class="modal-content">
                <h2>新しいクラブを作成</h2>
                <div class="form-group">
                    <label for="new-club-name">クラブ名</label>
                    <input type="text" id="new-club-name" placeholder="例: 水曜バドミントンサークル">
                </div>
                <div class="modal-actions">
                    <button id="btn-cancel-add-club" class="btn btn-secondary">キャンセル</button>
                    <button id="btn-save-club" class="btn btn-primary">作成</button>
                </div>
            </div>
        </div>

        <div id="modal-add-player" class="modal hidden">
            <div class="modal-content">
                <h2>メンバーを追加</h2>
                <div class="form-group">
                    <label for="new-player-name">名前</label>
                    <input type="text" id="new-player-name" placeholder="例: 田中 太郎">
                </div>
                <div class="form-group">
                    <label for="new-player-level">レベル (1-10)</label>
                    <input type="number" id="new-player-level" min="1" max="10" value="5">
                    <small>1: 初心者, 10: 上級者</small>
                </div>
                <div class="modal-actions">
                    <button id="btn-cancel-add-player" class="btn btn-secondary">キャンセル</button>
                    <button id="btn-save-player" class="btn btn-primary">追加</button>
                </div>
            </div>
        </div>

        <div id="modal-delete-club" class="modal hidden">
            <div class="modal-content">
                <h2>クラブを削除</h2>
                <p id="delete-club-message" style="margin-bottom: 1.5rem;">このクラブを削除してもよろしいですか？</p>
                <div class="modal-actions">
                    <button id="btn-cancel-delete-club" class="btn btn-secondary">キャンセル</button>
                    <button id="btn-confirm-delete-club" class="btn btn-primary"
                        style="background-color: var(--danger-color);">削除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/models.js"></script>
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
